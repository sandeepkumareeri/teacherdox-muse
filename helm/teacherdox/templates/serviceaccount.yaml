{{- /*
TeacherDox ServiceAccount Template
*/ -}}
{{- if .Values.global.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "teacherdox.serviceAccountName" . }}
  labels:
    {{- include "teacherdox.labels" . | nindent 4 }}
  {{- with .Values.global.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}