{{- /*
TeacherDox ConfigMap Template for Tenant Configurations
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.app.configMap.name }}
  labels:
    {{- include "teacherdox.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.tenantConfigs }}
  {{ $key }}: |
{{ $value | indent 4 }}
  {{- end }}