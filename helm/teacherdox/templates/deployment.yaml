{{- /*
TeacherDox Deployment Template
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "teacherdox.fullname" . }}
  labels:
    {{- include "teacherdox.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      {{- include "teacherdox.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if .Values.app.podAnnotations }}
        {{- toYaml .Values.app.podAnnotations | nindent 8 }}
        {{- end }}
      labels:
        {{- include "teacherdox.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.app.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "teacherdox.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.app.podSecurityContext | nindent 8 }}
      initContainers:
        {{- toYaml .Values.initContainers | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.global.image.repository }}:{{ .Values.global.image.tag }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.global.service.targetPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.app.env }}
            - name: {{ $key }}
              value: "{{ $value }}"
            {{- end }}
          envFrom:
            {{- range .Values.app.envFromSecrets }}
            - secretRef:
                name: {{ .name }}
                {{- if .prefix }}
                prefix: {{ .prefix }}
                {{- end }}
            {{- end }}
            {{- if .Values.app.configMap.enabled }}
            - configMapRef:
                name: {{ .Values.app.configMap.name }}
            {{- end }}
          volumeMounts:
            {{- toYaml .Values.app.volumeMounts | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.app.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.app.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.global.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.app.securityContext | nindent 12 }}
      {{- with .Values.app.sidecars }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      volumes:
        {{- if .Values.app.configMap.enabled }}
        - name: tenant-configs
          configMap:
            name: {{ .Values.app.configMap.name }}
            items:
              {{- range $key, $value := .Values.tenantConfigs }}
              - key: {{ $key }}
                path: {{ $value }}
              {{- end }}
        {{- end }}
        {{- toYaml .Values.additionalVolumes | nindent 8 }}
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30