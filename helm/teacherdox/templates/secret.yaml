{{- /*
TeacherDox Secret Template
References external secrets - create them separately or use External Secrets Operator
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: teacherdox-secrets
  labels:
    {{- include "teacherdox.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Core
  SESSION_SECRET: ""

  # Database
  DB_PASSWORD: ""

  # Redis
  REDIS_PASSWORD: ""

  # Meta AI
  META_API_KEY: ""

  # Gemini
  GEMINI_API_KEY: ""

  # WhatsApp
  AISENSY_API_KEY: ""
  AISENSY_PROJECT_API_KEY: ""
  AISENSY_WEBHOOK_SECRET: ""
  WHATSAPP_TOKEN: ""
  WHATSAPP_APP_SECRET: ""
  WHATSAPP_VERIFY_TOKEN: ""

  # Storage
  SUPABASE_SERVICE_KEY: ""

  # Admin
  ADMIN_PHONES: ""
  SUPPORT_PHONE: ""

  # Observability
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OTEL_EXPORTER_OTLP_HEADERS: ""

  # Geo
  GEO_DB_PATH: "/app/geo.sqlite"