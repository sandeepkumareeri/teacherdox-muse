version: '3.8'

# TeacherDox — Multi-Tenant Docker Compose
# Usage: docker-compose -f docker-compose.yml up -d
# For multi-tenant: docker-compose -f docker-compose.yml -f docker-compose.tenant.yml up -d

services:
  # ==================== POSTGRESQL ====================
  postgres:
    image: postgres:16-alpine
    container_name: teacherdox-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-teacherdox}
      POSTGRES_USER: ${DB_USER:-teacherdox}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-teacherdox}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./tenancy/migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-teacherdox} -d ${DB_NAME:-teacherdox}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - teacherdox-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ==================== REDIS ====================
  redis:
    image: redis:7-alpine
    container_name: teacherdox-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - teacherdox-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # ==================== TEACHERDOX APP ====================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: teacherdox-app
    environment:
      # Core
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      TZ: ${TZ:-Asia/Kolkata}
      SESSION_SECRET: ${SESSION_SECRET}

      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-teacherdox}
      DB_USER: ${DB_USER:-teacherdox}
      DB_PASSWORD: ${DB_PASSWORD:-teacherdox}
      DB_SSL: ${DB_SSL:-false}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Multi-tenancy
      TENANT_CONFIG_PATH: /app/tenancy/config
      DEFAULT_TENANT: default

      # Meta AI
      META_API_KEY: ${META_API_KEY}
      META_API_BASE: ${META_API_BASE:-https://api.meta.ai/v1}
      AI_BACKEND: ${AI_BACKEND:-gemini}
      META_MODEL_CHAT: ${META_MODEL_CHAT:-meta-llama/Llama-3.3-70B-Instruct}
      META_MODEL_VISION: ${META_MODEL_VISION:-meta-llama/Llama-3.2-90B-Vision-Instruct}
      META_MODEL_TRANSCRIBE: ${META_MODEL_TRANSCRIBE:-muse-voice-transcribe}
      META_MODEL_SAM: ${META_MODEL_SAM:-sam-3.1}
      META_DAILY_LIMIT: ${META_DAILY_LIMIT:-500}
      META_DAILY_LIMIT_PER_USER: ${META_DAILY_LIMIT_PER_USER:-40}

      # Gemini (fallback)
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_DAILY_LIMIT: ${GEMINI_DAILY_LIMIT:-500}

      # NLLB / SeamlessM4T / Llama (separate keys optional)
      NLLB_API_KEY: ${NLLB_API_KEY:-${META_API_KEY}}
      SEAMLESS_API_KEY: ${SEAMLESS_API_KEY:-${META_API_KEY}}
      LLAMA_API_KEY: ${LLAMA_API_KEY:-${META_API_KEY}}

      # WhatsApp
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-aisensy}
      WHATSAPP_BUSINESS_NUMBER: ${WHATSAPP_BUSINESS_NUMBER}
      AISENSY_API_KEY: ${AISENSY_API_KEY}
      AISENSY_PROJECT_API_KEY: ${AISENSY_PROJECT_API_KEY}
      AISENSY_WEBHOOK_SECRET: ${AISENSY_WEBHOOK_SECRET}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}

      # Storage
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      PUBLIC_STORAGE_URL: ${PUBLIC_STORAGE_URL}

      # Admin
      ADMIN_PHONES: ${ADMIN_PHONES}
      SUPPORT_PHONE: ${SUPPORT_PHONE}

      # Zero-effort
      ZERO_EFFORT_PHONES: ${ZERO_EFFORT_PHONES}
      ZERO_EFFORT_DAILY_CAP: ${ZERO_EFFORT_DAILY_CAP:-3}
      DIGEST_TIME: ${DIGEST_TIME:-16:30}
      AUTO_SUBMIT_TIME: ${AUTO_SUBMIT_TIME:-20:00}

      # Geo
      GEO_DB_PATH: ${GEO_DB_PATH:-/app/geo.sqlite}

      # Observability
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-teacherdox}

    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - teacherdox-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    restart: unless-stopped

  # ==================== NGINX REVERSE PROXY ====================
  nginx:
    image: nginx:alpine
    container_name: teacherdox-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - teacherdox-network
    restart: unless-stopped

  # ==================== CERTBOT (Let's Encrypt) ====================
  certbot:
    image: certbot/certbot
    container_name: teacherdox-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    networks:
      - teacherdox-network

  # ==================== PROMETHEUS (Optional) ====================
  prometheus:
    image: prom/prometheus:latest
    container_name: teacherdox-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - teacherdox-network
    profiles:
      - monitoring

  # ==================== GRAFANA (Optional) ====================
  grafana:
    image: grafana/grafana:latest
    container_name: teacherdox-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    networks:
      - teacherdox-network
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  teacherdox-network:
    driver: bridge